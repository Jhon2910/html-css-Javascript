<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile & Accounts — GameHub</title>

  <link rel="icon" type="image/png" href="img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .auth-card-box {
      max-width: 520px;
      margin: 40px auto;
      padding: 36px 30px;
      background: var(--bg-card);
      border: 1px solid var(--linha);
      border-radius: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .auth-card-box h2 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--texto);
    }

    .auth-card-box p {
      color: var(--texto-fraco);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-quick-login {
      width: 100%;
      background: var(--bg-card);
      color: var(--texto);
      border: 1px solid var(--linha);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn-quick-login:hover {
      background: var(--laranja);
      color: #ffffff;
      border-color: var(--laranja);
      transform: translateY(-1px);
    }
      border-color: #9ca3af;
      transform: translateY(-1px);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0;
      color: var(--texto-fraco);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--linha);
    }

    .auth-divider span {
      padding: 0 12px;
    }

    .form-auth {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    .form-auth label {
      font-size: 13px;
      font-weight: 600;
      color: var(--texto);
    }

    .form-auth input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--linha);
      background: var(--bg);
      color: var(--texto);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-auth input:focus {
      border-color: var(--laranja);
    }

    .btn-auth-submit {
      background: var(--laranja);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
      transition: opacity 0.2s;
    }

    .btn-auth-submit:hover {
      opacity: 0.9;
    }

    .perfil-topo {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 36px 0 24px;
      border-bottom: 1px solid var(--linha);
      flex-wrap: wrap;
    }

    .avatar-wrapper {
      position: relative;
      cursor: pointer;
    }

    .avatar-wrapper:hover .avatar-overlay {
      opacity: 1;
    }

    .avatar-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .perfil-avatar-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--laranja);
      display: block;
    }

    .perfil-avatar-fallback {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--laranja);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
    }

    .perfil-info h1 {
      font-size: 26px;
      margin-bottom: 4px;
      color: var(--texto);
    }

    .perfil-info p {
      color: var(--texto-fraco);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .perfil-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(61, 220, 151, 0.15);
      color: var(--verde);
      font-size: 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    .perfil-acoes-topo {
      display: flex;
      gap: 10px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .btn-perfil-acao {
      background: transparent;
      border: 1px solid var(--linha);
      color: var(--texto);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-perfil-acao:hover {
      border-color: var(--laranja);
      color: var(--laranja);
    }

    .btn-logout:hover {
      border-color: #ef4444 !important;
      color: #ef4444 !important;
    }

    /* MULTI-ACCOUNT MANAGER */
    .secao-contas-box {
      background: var(--bg-card);
      border: 1px solid var(--linha);
      border-radius: 12px;
      padding: 24px;
      margin: 28px 0;
      box-shadow: var(--shadow);
    }

    .secao-contas-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .secao-contas-header h3 {
      font-size: 17px;
      color: var(--texto);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grade-contas-salvas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card-conta-item {
      background: var(--bg);
      border: 1px solid var(--linha);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s ease;
    }

    .card-conta-item.ativa {
      border-color: var(--verde);
      background: rgba(61, 220, 151, 0.04);
    }

    .card-conta-user {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .card-conta-foto {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--linha);
      flex-shrink: 0;
    }

    .card-conta-detalhes strong {
      display: block;
      font-size: 13px;
      color: var(--texto);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .card-conta-detalhes span {
      font-size: 11px;
      color: var(--texto-fraco);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      max-width: 150px;
    }

    .jogos-favoritos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .card-fav {
      background: var(--bg-card);
      border: 1px solid var(--linha);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s;
    }

    .card-fav:hover {
      transform: translateY(-3px);
      border-color: var(--laranja);
    }

    .card-fav-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center center;
    }

    .card-fav-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-fav-body h4 {
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--texto);
    }

    .card-fav-body span {
      font-size: 12px;
      color: var(--texto-fraco);
    }

    .btn-remover-fav {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 12px;
      cursor: pointer;
      padding: 8px 0 0;
      text-align: left;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.aberto {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--linha);
      border-radius: 14px;
      max-width: 480px;
      width: 100%;
      padding: 30px;
      position: relative;
      box-shadow: var(--shadow);
    }

    .btn-fechar-modal {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: none;
      color: var(--texto-fraco);
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="index_en.html" class="logo">GAME<span>HUB</span></a>

      <div class="header-right">
        <nav class="nav">
          <a href="index_en.html">Home</a>
          <a href="catalogo_en.html">Catalog</a>
          <a href="perfil_en.html" class="ativo">Profile & Accounts</a>
          <a href="noticias_en.html">News</a>
          <a href="contato_en.html">Contact</a>
        </nav>

        <div class="header-controls">
          <a href="../../portfolio_en.html" class="btn-voltar-portfolio" title="Return to Portfolio">
            <i class="fa-solid fa-arrow-left"></i> <span>Portfolio</span>
          </a>
          <a href="https://github.com/Jhon2910" target="_blank" rel="noopener noreferrer" class="header-icon-link" title="GitHub (@Jhon2910)" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="perfil.html" class="lang-toggle" title="Switch to Portuguese">
            <span>PT</span> / <span class="active">EN</span>
          </a>

          <button class="theme-toggle-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <i class="fa-regular fa-moon"></i>
          </button>
        </div>

        <button class="menu-toggle" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="container" id="perfil-view">
    <!-- Rendered dynamically via JavaScript -->
  </div>

  <!-- MODAL TO ADD ANOTHER PROFILE / ACCOUNT -->
  <div class="modal-overlay" id="modal-adicionar-conta">
    <div class="modal-box">
      <button class="btn-fechar-modal" id="btn-fechar-modal-conta">&times;</button>
      <div style="text-align: center; margin-bottom: 20px;">
        <i class="fa-solid fa-user-plus" style="font-size: 32px; color: var(--laranja); margin-bottom: 8px;"></i>
        <h3 style="font-size: 20px; color: var(--texto);">Add New Account</h3>
        <p style="font-size: 13px; color: var(--texto-fraco);">Register a new player profile with your name and email.</p>
      </div>

      <form class="form-auth" id="form-adicionar-conta-manual">
        <div>
          <label for="modal-nome">Name / Gamer Tag</label>
          <input type="text" id="modal-nome" placeholder="e.g. Player 2" required>
        </div>
        <div>
          <label for="modal-email">Email</label>
          <input type="email" id="modal-email" placeholder="player2@example.com" required>
        </div>
        <button type="submit" class="btn-auth-submit">
          <i class="fa-solid fa-plus"></i> Save & Switch to this Account
        </button>
      </form>
    </div>
  </div>

  <input type="file" id="input-avatar-upload" accept="image/*" style="display: none;" />

  <footer class="footer">
    <div class="container">
      <span>© 2026 GameHub. Developed by Jonathan Alexandre.</span>
      <div class="footer-links">
        <a href="../../portfolio_en.html"><i class="fa-solid fa-arrow-left"></i> Return to Portfolio</a>
        <a href="catalogo_en.html">Catalog</a>
        <a href="contato_en.html">Contact</a>
        <a href="https://github.com/Jhon2910" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> GitHub</a>
        <a href="https://www.linkedin.com/in/jonathan-rodrigues-06a1b7442" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const perfilView = document.getElementById("perfil-view");
      const usuario = obterUsuarioLogado();
      const todasContas = typeof obterTodasContas === "function" ? obterTodasContas() : [];

      if (!usuario) {
        // INITIAL SIGN IN
        perfilView.innerHTML = `
          <div class="auth-card-box">
            <i class="fa-solid fa-gamepad" style="font-size: 40px; color: var(--laranja); margin-bottom: 14px;"></i>
            <h2>Access your GameHub Profile</h2>
            <p>Enter your name and email to access your personalized library and save your favorite games.</p>

            <form class="form-auth" id="form-cadastro-inicial">
              <div>
                <label for="cad-nome">Your Name / Gamer Tag</label>
                <input type="text" id="cad-nome" placeholder="e.g. Jonathan Alexandre" required>
              </div>
              <div>
                <label for="cad-email">Your Email</label>
                <input type="email" id="cad-email" placeholder="jonathanalexandre2910@gmail.com" required>
              </div>
              <button type="submit" class="btn-auth-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In / Create Profile
              </button>
            </form>

            <div class="auth-divider">
              <span>or quick access</span>
            </div>

            <button class="btn-quick-login" id="btn-quick-jonathan">
              <i class="fa-solid fa-user-check"></i>
              <span>Sign In as Jonathan Alexandre</span>
            </button>
          </div>
        `;

        document.getElementById("btn-quick-jonathan")?.addEventListener("click", () => {
          cadastrarOuTrocarContaManual("Jonathan Alexandre", "jonathanalexandre2910@gmail.com", "img/avatar-jonathan.png");
          window.location.reload();
        });

        document.getElementById("form-cadastro-inicial")?.addEventListener("submit", (e) => {
          e.preventDefault();
          const nome = document.getElementById("cad-nome").value;
          const email = document.getElementById("cad-email").value;
          if (cadastrarOuTrocarContaManual(nome, email)) {
            window.location.reload();
          }
        });

      } else {
        // ACTIVE PROFILE + ACCOUNT MANAGER
        const favoritosIds = obterFavoritos();
        const jogosFavoritos = typeof listaDeJogos !== "undefined" 
          ? listaDeJogos.filter(j => favoritosIds.includes(j.id)) 
          : [];
        const categoriasUnicas = new Set(jogosFavoritos.map(j => j.categoria_en || j.categoria)).size;

        perfilView.innerHTML = `
          <div class="perfil-topo">
            <div class="avatar-wrapper" id="btn-trigger-upload" title="Click to change profile picture">
              ${usuario.foto 
                ? `<img src="${usuario.foto}" alt="${escapeHtml(usuario.nome)}" class="perfil-avatar-img" id="img-avatar-perfil">`
                : `<div class="perfil-avatar-fallback">${escapeHtml(usuario.nome.charAt(0).toUpperCase())}</div>`
              }
              <div class="avatar-overlay">
                <i class="fa-solid fa-camera"></i>
              </div>
            </div>

            <div class="perfil-info">
              <h1>${escapeHtml(usuario.nome)}</h1>
              <p><i class="fa-regular fa-envelope"></i> ${escapeHtml(usuario.email)}</p>
              <div class="perfil-badge">
                <i class="fa-solid fa-circle-check"></i> Active Profile • Member since ${usuario.criadoEm || 'Feb. 2026'}
              </div>
            </div>

            <div class="perfil-acoes-topo">
              <button class="btn-perfil-acao" id="btn-abrir-modal-contas">
                <i class="fa-solid fa-users-gear"></i> Switch / Add Account
              </button>
              <button class="btn-perfil-acao btn-logout" id="btn-logout-action">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
              </button>
            </div>
          </div>

          <!-- CONNECTED ACCOUNTS MANAGER -->
          <div class="secao-contas-box">
            <div class="secao-contas-header">
              <div>
                <h3><i class="fa-solid fa-users" style="color: var(--laranja);"></i> Account Manager (${todasContas.length})</h3>
                <p style="font-size: 13px; color: var(--texto-fraco);">Quickly switch between accounts or add a new email profile.</p>
              </div>
              <button class="btn-perfil-acao" id="btn-add-conta-atalho" style="border-color: var(--laranja); color: var(--laranja);">
                <i class="fa-solid fa-user-plus"></i> + New Account
              </button>
            </div>

            <div class="grade-contas-salvas">
              ${todasContas.map(conta => {
                const ehAtiva = conta.email.toLowerCase() === usuario.email.toLowerCase();
                return `
                  <div class="card-conta-item ${ehAtiva ? 'ativa' : ''}">
                    <div class="card-conta-user">
                      <img src="${conta.foto || 'img/avatar-jonathan.png'}" class="card-conta-foto" onerror="this.src='img/avatar-jonathan.png'">
                      <div class="card-conta-detalhes">
                        <strong>${escapeHtml(conta.nome)}</strong>
                        <span>${escapeHtml(conta.email)}</span>
                      </div>
                    </div>
                    <div>
                      ${ehAtiva ? `
                        <span style="font-size: 11px; font-weight: 600; color: var(--verde); background: rgba(61,220,151,0.15); padding: 4px 8px; border-radius: 4px;">
                          <i class="fa-solid fa-check"></i> Active
                        </span>
                      ` : `
                        <button class="btn-perfil-acao" onclick="trocarParaConta('${escapeHtml(conta.email)}')" style="padding: 4px 8px; font-size: 11px;">
                          Switch
                        </button>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="ficha-stats" style="grid-template-columns: repeat(4, 1fr); margin: 24px 0 36px;">
            <div class="ficha-stat">
              <strong>${jogosFavoritos.length}</strong>
              <span>Games in library</span>
            </div>
            <div class="ficha-stat">
              <strong>${categoriasUnicas}</strong>
              <span>Favorite genres</span>
            </div>
            <div class="ficha-stat">
              <strong>${listaDeJogos.length}</strong>
              <span>Total in catalog</span>
            </div>
            <div class="ficha-stat">
              <strong>100%</strong>
              <span>Active profile</span>
            </div>
          </div>

          <section class="secao" style="border-bottom: none; padding-top: 0;">
            <div class="secao-titulo">
              <h2>My Library & Favorites (${jogosFavoritos.length})</h2>
              <a href="catalogo_en.html" class="ver-tudo">+ Add more games →</a>
            </div>

            ${jogosFavoritos.length === 0 ? `
              <p style="color: var(--texto-fraco); padding: 20px 0;">
                Your library is empty. <a href="catalogo_en.html" style="color: var(--laranja); text-decoration: underline;">Click here to browse all games in the catalog</a> and build your collection!
              </p>
            ` : `
              <div class="jogos-favoritos-grid">
                ${jogosFavoritos.map(j => `
                  <div class="card-fav">
                    <a href="jogo_en.html?id=${j.id}">
                      <img src="${j.imagem}" alt="${escapeHtml(j.nome_en || j.nome)}" class="card-fav-img" onerror="this.onerror=null;this.src='https://cdn.cloudflare.steamstatic.com/steam/apps/292030/library_600x900_2x.jpg';">
                    </a>
                    <div class="card-fav-body">
                      <div>
                        <span style="color: var(--verde); font-size: 11px; font-weight: 600; text-transform: uppercase;">${escapeHtml(j.categoria_en || j.categoria)}</span>
                        <h4>${escapeHtml(j.nome_en || j.nome)}</h4>
                        <span>⭐ ${j.nota} • ${escapeHtml(j.desenvolvedora)}</span>
                      </div>
                      <button class="btn-remover-fav" onclick="removerFavoritoDoPerfil(${j.id})">
                        <i class="fa-regular fa-trash-can"></i> Remove from list
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </section>
        `;

        document.getElementById("btn-logout-action")?.addEventListener("click", fazerLogout);

        // Interactive avatar upload
        const btnUpload = document.getElementById("btn-trigger-upload");
        const fileInput = document.getElementById("input-avatar-upload");

        if (btnUpload && fileInput) {
          btnUpload.addEventListener("click", () => fileInput.click());
          fileInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = function (e) {
                atualizarFotoPerfil(e.target.result);
                window.location.reload();
              };
              reader.readAsDataURL(file);
            }
          });
        }

        // Modal actions
        const modal = document.getElementById("modal-adicionar-conta");
        const btnAbrirModal = document.getElementById("btn-abrir-modal-contas");
        const btnAddAtalho = document.getElementById("btn-add-conta-atalho");
        const btnFecharModal = document.getElementById("btn-fechar-modal-conta");

        const abrirModal = () => modal.classList.add("aberto");
        const fecharModal = () => modal.classList.remove("aberto");

        btnAbrirModal?.addEventListener("click", abrirModal);
        btnAddAtalho?.addEventListener("click", abrirModal);
        btnFecharModal?.addEventListener("click", fecharModal);

        document.getElementById("form-adicionar-conta-manual")?.addEventListener("submit", (e) => {
          e.preventDefault();
          const nome = document.getElementById("modal-nome").value;
          const email = document.getElementById("modal-email").value;
          if (cadastrarOuTrocarContaManual(nome, email)) {
            window.location.reload();
          }
        });
      }
    });

    window.trocarParaConta = function(email) {
      const contas = typeof obterTodasContas === "function" ? obterTodasContas() : [];
      const conta = contas.find(c => c.email.toLowerCase() === email.toLowerCase());
      if (conta && typeof ativarConta === "function") {
        ativarConta(conta);
        window.location.reload();
      }
    };

    window.removerFavoritoDoPerfil = function(id) {
      alternarFavorito(id);
      window.location.reload();
    };
  </script>

</body>
</html>
