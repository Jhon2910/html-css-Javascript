<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Catalog — GameHub</title>

  <link rel="icon" type="image/png" href="img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .busca-wrapper {
      margin-bottom: 24px;
    }

    .campo-busca {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--linha);
      color: var(--texto);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .campo-busca:focus {
      border-color: var(--laranja);
    }

    .catalogo-stats {
      color: var(--texto-fraco);
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="index_en.html" class="logo">GAME<span>HUB</span></a>

      <div class="header-right">
        <nav class="nav">
          <a href="index_en.html">Home</a>
          <a href="catalogo_en.html" class="ativo">Catalog</a>
          <a href="perfil_en.html">Profile</a>
          <a href="noticias_en.html">News</a>
          <a href="contato_en.html">Contact</a>
        </nav>

        <div class="header-controls">
          <a href="../../portfolio_en.html" class="btn-voltar-portfolio" title="Return to Portfolio">
            <i class="fa-solid fa-arrow-left"></i> <span>Portfolio</span>
          </a>
          <a href="https://github.com/Jhon2910" target="_blank" rel="noopener noreferrer" class="header-icon-link" title="GitHub (@Jhon2910)" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="catalogo.html" class="lang-toggle" title="Switch to Portuguese">
            <span>PT</span> / <span class="active">EN</span>
          </a>

          <button class="theme-toggle-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <i class="fa-regular fa-moon"></i>
          </button>
        </div>

        <button class="menu-toggle" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero" style="padding: 48px 0;">
    <div class="container" style="grid-template-columns: 1fr; text-align: left;">
      <div>
        <div class="hero-tag">FULL GAME CATALOG</div>
        <h1 style="font-size: 36px;">All Games</h1>
        <p>Search the catalog, check game details, and save favorites to your library.</p>
      </div>
    </div>
  </section>

  <section class="secao" style="border-bottom: none;">
    <div class="container">

      <!-- REAL-TIME SEARCH -->
      <div class="busca-wrapper">
        <input type="text" id="campo-busca" class="campo-busca" placeholder="🔍 Search by game title, developer or genre..." autocomplete="off">
      </div>

      <!-- CATEGORY FILTERS -->
      <div class="filtros">
        <button class="filtro-btn ativo" data-categoria="todos">All</button>
        <button class="filtro-btn" data-categoria="Action">Action/Adventure</button>
        <button class="filtro-btn" data-categoria="RPG">RPG</button>
        <button class="filtro-btn" data-categoria="Shooter">Shooter (FPS/TPS)</button>
        <button class="filtro-btn" data-categoria="Strategy">Strategy/Simulation</button>
        <button class="filtro-btn" data-categoria="Sports">Sports/Racing</button>
        <button class="filtro-btn" data-categoria="Platformer">Platformer/Indie</button>
      </div>

      <div class="catalogo-stats" id="catalogo-contador">
        Loading games...
      </div>

      <!-- GAMES GRID -->
      <div class="grade-jogos" id="grade-jogos-catalogo"></div>
      <nav class="paginacao-catalogo" id="paginacao-catalogo" aria-label="Catalog pagination"></nav>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <span>© 2026 GameHub. Developed by Jonathan Alexandre.</span>
      <div class="footer-links">
        <a href="../../portfolio_en.html"><i class="fa-solid fa-arrow-left"></i> Return to Portfolio</a>
        <a href="perfil_en.html">My Profile</a>
        <a href="contato_en.html">Contact</a>
        <a href="https://github.com/Jhon2910" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> GitHub</a>
        <a href="https://www.linkedin.com/in/jonathan-rodrigues-06a1b7442" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/steam-grid.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
