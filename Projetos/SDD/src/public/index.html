<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Chamado - Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Novo Chamado</h1>
        <form id="form-chamado">
            <div class="form-group">
                <label for="titulo">Título (máx. 50 caracteres):</label>
                <input type="text" id="titulo" name="titulo" maxlength="50" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecione uma categoria...</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Rede e Internet">Rede e Internet</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição (máx. 500 caracteres):</label>
                <textarea id="descricao" name="descricao" maxlength="500" rows="5" required></textarea>
            </div>

            <button type="submit">Abrir Chamado</button>
        </form>
        <div id="mensagem-erro" class="erro" style="display: none;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
